[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-net"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
accelerated = [
    "numba>=0.64.0",
]

[project.scripts]
neural-net-demo = "neural_net.demo:main"
